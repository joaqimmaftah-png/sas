name: CD

# Runs after CI: builds, tests and packages a release.
#
# This project runs on a local XAMPP stack, so "deploy" normally means copying
# files into xampp/htdocs/sas. The `build` job produces a sas-release.zip
# artifact - download it and drop it into your XAMPP htdocs folder to deploy.
#
# If you ever want to push straight to a remote/staging server instead, the
# optional `deploy` job runs only when you set these repository secrets:
#   DEPLOY_ENABLED  = "true"
#   DEPLOY_HOST     = user@your-server   (SSH target)
#   DEPLOY_PATH     = /var/www/sas        (destination directory)
#   DEPLOY_SSH_KEY  = ----BEGIN OPENSSH PRIVATE KEY----...  (SSH key for rsync)
# With no secrets set the workflow just packages the release, so it is safe to
# enable immediately.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 1
          MYSQL_DATABASE: sas_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-timeout=10s
          --health-retries=30

    env:
      SAS_DB_HOST: 127.0.0.1
      SAS_DB_PORT: "3306"
      SAS_DB_USER: root
      SAS_DB_PASS: ""
      SAS_DB_NAME: sas_test
      SAS_TEST_DB_NAME: sas_test
      SAS_TIMEZONE: UTC
      SAS_DEBUG: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none

      - name: Lint all PHP files
        run: php tests/lint.php

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 --silent 2>/dev/null; then
              echo "MySQL is ready"; exit 0
            fi
            echo "Waiting for MySQL... ($i)"; sleep 2
          done
          echo "MySQL did not become ready"; exit 1

      - name: Run leave module tests
        run: php tests/run.php

      - name: Package release
        run: git archive --format=zip -o sas-release.zip HEAD

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sas-release
          path: sas-release.zip
          retention-days: 30

  deploy:
    name: Deploy
    needs: build
    # Only run when deployment has been explicitly enabled with secrets.
    if: ${{ secrets.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to remote server via rsync (optional)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Deploy secrets are incomplete; skipping deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Exclude VCS and local artifacts from the deploy copy.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            --exclude '.git/' \
            --exclude 'sas-release.zip' \
            ./ "$DEPLOY_HOST:$DEPLOY_PATH/"
          echo "Deployed to $DEPLOY_HOST:$DEPLOY_PATH"
